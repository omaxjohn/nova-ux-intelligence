name: Validate skill and plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate package and frozen contract
        run: python3 tests/check_structure.py
      - name: Validate ChatGPT plugin package
        run: python3 tests/check_plugin_package.py
